version: '3.8'

# =====================================================
# VOLUNTEER MANAGEMENT SYSTEM - Production Ready
# =====================================================
# Cach su dung:
# 1. Copy file .env.example thanh .env va dien cac gia tri
# 2. Chay: docker-compose -f docker-compose.prod.yml up -d
# =====================================================

services:
  # PostgreSQL Database voi du lieu san
  postgres:
    image: postgres:16-alpine
    container_name: volunteer-postgres
    environment:
      POSTGRES_DB: volunteer_db
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount folder chua SQL init - tu dong chay khi database rong
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - volunteer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volunteer -d volunteer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot Backend Application
  app:
    image: ${DOCKER_IMAGE:-volunteer-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volunteer-app
    env_file:
      - .env
    environment:
      # Database connection (su dung ten service "postgres" trong Docker network)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/volunteer_db
      SPRING_DATASOURCE_USERNAME: volunteer
      SPRING_DATASOURCE_PASSWORD: volunteer

      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"

      # Active Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # Server
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - volunteer-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local

networks:
  volunteer-network:
    driver: bridge
