name: Java CI/CD with Maven & Render

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-verify:
    name: Build, Test & Verify Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # 1. Chạy Unit Test & Integration Test (verify tốt hơn test)
      - name: Run Tests with Maven
        run: ./mvnw clean verify

      # 2. Tạo JaCoCo Report
      - name: Generate JaCoCo Report
        run: ./mvnw jacoco:report

      # 3. Upload coverage lên Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: L01Bestapp/volunteer-be
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      # 4. Upload Artifacts (để xem lại nếu cần)
      - name: Upload Test Results & Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 15

      # 5. Quan trọng: Kiểm tra xem Dockerfile có build được không
      # Bước này giúp đảm bảo code Java ngon VÀ Dockerfile cũng ngon trước khi gọi Render
      - name: Verify Docker Build
        run: docker build . --file Dockerfile --tag volunteer-api:test

  deploy:
    name: Trigger Render Deploy
    needs: build-test-verify # Chỉ chạy khi job trên thành công 100%
    runs-on: ubuntu-latest
    # Chỉ deploy khi code được merge vào main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Call Render Deploy Hook
        # Thêm -f để curl báo lỗi nếu HTTP status code >= 400
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Notification
        run: echo "🚀 Deploy signal sent to Render! Check dashboard."