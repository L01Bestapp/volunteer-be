name: Java CI/CD with Maven & Docker Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-verify:
    name: Build, Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # 1. Chạy Unit Test & Integration Test
      - name: Run Tests with Maven
        run: ./mvnw clean verify

      # 2. Tạo JaCoCo Report
      - name: Generate JaCoCo Report
        run: ./mvnw jacoco:report

      # 3. Upload coverage lên Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: L01Bestapp/volunteer-be
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      # 4. Upload Artifacts
      - name: Upload Test Results & Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 15

  build-and-push-docker:
    name: Build & Push Docker Image
    needs: build-test-verify
    runs-on: ubuntu-latest
    # Chỉ build & push khi code được merge vào main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Login vào Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Setup Docker Buildx (để build nhanh hơn và hỗ trợ cache)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build và Push image lên Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/volunteer-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/volunteer-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/volunteer-api:latest
          cache-to: type=inline

      - name: Notification
        run: echo "✅ Docker image pushed to Docker Hub successfully!"

  deploy:
    name: Deploy to Railway
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      # Đợi 30s để Docker Hub cập nhật registry
      - name: Wait for Docker Hub
        run: sleep 30

      - name: Trigger Railway Redeploy
        run: railway redeploy --service=${{ secrets.RAILWAY_SERVICE_ID }} --yes

      - name: Notification
        run: echo "🚀 Successfully deployed to Railway!"