services:
  - type: web
    name: volunteer-api
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health

    # QUAN TRỌNG: Tắt autoDeploy để GitHub Actions nắm quyền kiểm soát
    autoDeploy: false
    branch: main

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: POSTGRES_HOST
        value: dpg-d5j5ic14tr6s73e521lg-a.singapore-postgres.render.com
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_DB
        value: volunteer_db_5xrg
      - key: POSTGRES_USER
        value: volunteer
      - key: POSTGRES_PASSWORD
        sync: false
      - key: BASE_URL_WEBSITE
        value: https://volunteer-api.onrender.com

      # Các key nhạy cảm (JWT, OAuth, Mail...) giữ nguyên sync: false
      - key: JWT_PRIVATE_KEY_CONTENT
        sync: false
      - key: JWT_PUBLIC_KEY_CONTENT
        sync: false
      - key: JWT_KEY_ID
        value: ctxh-key
      - key: EXP_TOKEN
        value: 604800
      - key: EXP_REFRESH_TOKEN
        value: 2592000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAIL_SENDER_USERNAME
        sync: false
      - key: MAIL_SENDER_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false